version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: founder0_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: founder0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.18-community
    container_name: founder0_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # HTTP UI
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
